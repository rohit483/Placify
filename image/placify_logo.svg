<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Dark to Light Blue Gradient for the 'P' -->
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#001a66" />
    </linearGradient>
    <!-- Purple to Cyan Gradient for the Speed Lines -->
    <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0088ff" />
      <stop offset="100%" stop-color="#8a2be2" />
    </linearGradient>
  </defs>

  <!-- Left Speed Lines -->
  <rect x="150" y="210" width="40" height="12" rx="6" fill="url(#speedGrad)" />
  <rect x="120" y="240" width="70" height="12" rx="6" fill="url(#speedGrad)" />
  <rect x="140" y="270" width="50" height="12" rx="6" fill="url(#speedGrad)" />

  <!-- Main 'P' Shape (Left Stem) -->
  <path d="M 180 120 L 180 340 A 40 40 0 0 0 230 310 L 230 120 Z" fill="url(#pGrad)"/>
  
  <!-- Main 'P' Shape (Right Curve) -->
  <path d="M 190 120 C 370 100 400 290 260 300 L 240 300 L 240 240 C 310 240 310 160 230 170 Z" fill="url(#pGrad)"/>

  <!-- The Tie (Negative Space Center) -->
  <path d="M 245 175 L 275 175 L 265 195 L 275 270 L 260 290 L 245 270 L 255 195 Z" fill="#001a66"/>

  <!-- Main Placify Text -->
  <text x="250" y="400" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#000b2e" text-anchor="middle" letter-spacing="2">Placify</text>

  <!-- Tagline Text -->
  <text x="250" y="440" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333333" text-anchor="middle" letter-spacing="4">
    PREPARE. <tspan fill="#0066ff">MATCH.</tspan> SUCCEED.
  </text>
</svg>
