services:
  # -------------------------------------------------------------------------
  # 1. WEB SERVICE (FastAPI App)
  # -------------------------------------------------------------------------
  web:
    build: .
    container_name: placify_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload # Use --reload for development; remove for production
    volumes:
      - .:/app
    # Load environment variables from file
    env_file:
      - ./venv/.env
      #- ./placify_env/.env  # if using custom env folder name
      #- .env               # if .env file is in the root directory
    ports:
      - "8000:8000" # Expose directly for debugging
    depends_on:
      db:
        condition: service_healthy
    networks:
      - placify_network
  # -------------------------------------------------------------------------
  # 2. PROXY SERVICE (Nginx)
  # -------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: placify_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/static:ro # Serve static files directly
    ports:
      - "80:80" # Expose directly for production
    depends_on:
      - web
    networks:
      - placify_network
  # -------------------------------------------------------------------------
  # 3. DATABASE SERVICE (PostgreSQL)
  # -------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: placify_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - venv/.env
      #- placify_env/.env   # if using custom env folder name
      #- .env               # if .env file is in the root directory
    ports:
      - "5432:5432"
    networks:
      - placify_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  placify_network:
    driver: bridge

volumes:
  postgres_data:
